<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex, nofollow">
    <title data-i18n="page.contactTitle">Contact - JuanGamerPlayz</title>
    <link rel="icon" href="../favicon.ico" sizes="48x48">
    <link rel="icon" type="image/png" href="../assets/images/favicon/Juan_OC_Favicon.png" sizes="512x512">
    <link rel="apple-touch-icon" href="../assets/images/favicon/apple-touch-icon.png">
    <link rel="stylesheet" href="../assets/css/style.css">
    <link rel="stylesheet" href="../assets/css/language.css">
    <link rel="stylesheet" href="../assets/css/classic.css">
    <link rel="stylesheet" href="../assets/css/theme.css">
</head>
<body>
    <main class="contact-page">
        <section class="contact-hero" aria-labelledby="contact-title">
            <div class="contact-hero__scrim" aria-hidden="true"></div>
            <h1 id="contact-title" data-i18n="contact.hero.title">Contact Me</h1>
        </section>

        <section class="contact-about" aria-labelledby="contact-about-title">
            <div class="contact-about__inner">
                <div class="contact-about__content">
                    <h2 id="contact-about-title" class="sr-only" data-i18n="contact.about.title">Get in Touch</h2>
                    <p data-i18n="contact.about.p1">If you liked my work, feel free to reach out to me at any time!</p>
                    <p data-i18n="contact.about.p2">I'm always open to connect with fellow developers and creators to chat! Thank you!</p>
                    <ul class="contact-social__grid" role="list">
                        <li class="contact-social__item">
                            <div class="contact-social__link">
                                <div class="contact-social__icon">
                                    <img src="../assets/images/logos/logo_dc_2026.png" alt="" loading="lazy" width="528" height="400">
                                </div>
                                <span class="contact-social__name" data-i18n="contact.social.discord">Discord</span>
                                <span class="contact-social__handle">JuanGamerPlayz</span>
                            </div>
                        </li>
                    </ul>
                </div>
                <div class="contact-about__character" role="img" aria-label="Character drawing"></div>
            </div>
        </section>
    </main>

    <script src="../assets/js/header.js"></script>
    <script src="../assets/js/footer.js"></script>
</body>
</html>
