name: Deploy

on:
  push:
    branches: [main, master]
  workflow_dispatch:
    inputs:
      download_art:
        description: "Download protected art assets from private source"
        required: false
        default: "true"
        type: boolean

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Download protected art assets
        if: github.event_name == 'push' || github.event.inputs.download_art == 'true'
        env:
          GH_TOKEN: ${{ secrets.ART_ASSETS_TOKEN }}
        run: |
          mkdir -p assets/images/concept-art/crypt-hunter
          gh release download v1 \
            --repo JuanGamerPlayz/concept-art-assets \
            -p "*.zip" \
            -O /tmp/concept-art.zip
          unzip -o /tmp/concept-art.zip -d assets/images/concept-art/crypt-hunter/
          ls -la assets/images/concept-art/crypt-hunter/

      - name: Download protected UI/UX assets
        if: github.event_name == 'push' || github.event.inputs.download_art == 'true'
        env:
          GH_TOKEN: ${{ secrets.ART_ASSETS_TOKEN }}
        run: |
          gh release download ui-ux-designs-v1 \
            --repo JuanGamerPlayz/concept-art-assets \
            -p "*.zip" \
            -O /tmp/ui-ux.zip
          rm -rf /tmp/ui-ux-extracted
          unzip -o /tmp/ui-ux.zip -d /tmp/ui-ux-extracted

          # Map the zip's project folder names onto the site's asset folders
          mkdir -p assets/images/ui-ux/listou
          mkdir -p assets/images/ui-ux/the-last-outcome
          mkdir -p assets/images/ui-ux/chop-and-clock
          mkdir -p assets/images/ui-ux/hammer-smasher

          cp -f /tmp/ui-ux-extracted/Listou/*.png assets/images/ui-ux/listou/
          cp -f "/tmp/ui-ux-extracted/The Last Outcome"/*.png assets/images/ui-ux/the-last-outcome/
          cp -f "/tmp/ui-ux-extracted/Chop & Clock!"/*.png assets/images/ui-ux/chop-and-clock/
          cp -f "/tmp/ui-ux-extracted/Hammer Smasher"/*.png assets/images/ui-ux/hammer-smasher/

          echo "=== Downloaded UI/UX files ==="
          for d in listou the-last-outcome chop-and-clock hammer-smasher; do
            count=$(ls -1 "assets/images/ui-ux/$d"/*.png 2>/dev/null | wc -l)
            echo "  $d: $count png"
            if [ "$count" -eq 0 ]; then
              echo "ERROR: No UI/UX files for '$d' in ui-ux.zip."
              exit 1
            fi
          done

      - name: Download protected 3D Art assets
        if: github.event_name == 'push' || github.event.inputs.download_art == 'true'
        env:
          GH_TOKEN: ${{ secrets.ART_ASSETS_TOKEN }}
        run: |
          mkdir -p "assets/images/3d-art/the-last-outcome"
          gh release download up-models-v1 \
            --repo JuanGamerPlayz/concept-art-assets \
            -p "*.zip" \
            -O /tmp/3d-art.zip
          mkdir -p /tmp/3d-art-extracted
          unzip -o /tmp/3d-art.zip -d /tmp/3d-art-extracted

          # Rename The Last Outcome files with TLO_Model_ prefix pattern
          find /tmp/3d-art-extracted -name "*.png" | while read f; do
            base=$(basename "$f" .png)
            case "$base" in
              eggman-final-render) cp "$f" "assets/images/3d-art/the-last-outcome/TLO_Model_Eggman_Final_Render.png" ;;
              sonic-final-render) cp "$f" "assets/images/3d-art/the-last-outcome/TLO_Model_Sonic_Final_Render.png" ;;
              tails-final-render) cp "$f" "assets/images/3d-art/the-last-outcome/TLO_Model_Tails_Final_Render.png" ;;
              tails-final-render-alt) cp "$f" "assets/images/3d-art/the-last-outcome/TLO_Model_Tails_Final_Render_Alt.png" ;;
              2011x-final-render) cp "$f" "assets/images/3d-art/the-last-outcome/TLO_Model_2011x_Final_Render.png" ;;
              2011x-final-render-alt) cp "$f" "assets/images/3d-art/the-last-outcome/TLO_Model_2011x_Final_Render_Alt.png" ;;
            esac
          done

          echo "=== Downloaded The Last Outcome 3D art files ==="
          ls -la "assets/images/3d-art/the-last-outcome/"
          if [ "$(ls -A assets/images/3d-art/the-last-outcome/)" == "" ]; then
            echo "ERROR: No The Last Outcome 3D art files found. Check that release 'up-models-v1' exists on concept-art-assets."
            exit 1
          fi

          # Chop & Clock! 3D models ship with their final names in the same zip
          mkdir -p "assets/images/3d-art/chop-and-clock"
          find /tmp/3d-art-extracted -name "CC_Model_*.png" -exec cp {} "assets/images/3d-art/chop-and-clock/" \;
          echo "=== Downloaded Chop & Clock 3D art files ==="
          ls -la "assets/images/3d-art/chop-and-clock/"
          if [ "$(ls -A assets/images/3d-art/chop-and-clock/)" == "" ]; then
            echo "ERROR: No Chop & Clock 3D art files found in 3d-art.zip."
            exit 1
          fi

          # Hammer Smasher! 3D models ship with their final names in the same zip
          mkdir -p "assets/images/3d-art/hammer-smasher"
          find /tmp/3d-art-extracted -name "HS_Model_*.png" -exec cp {} "assets/images/3d-art/hammer-smasher/" \;
          echo "=== Downloaded Hammer Smasher 3D art files ==="
          ls -la "assets/images/3d-art/hammer-smasher/"
          if [ "$(ls -A assets/images/3d-art/hammer-smasher/)" == "" ]; then
            echo "ERROR: No Hammer Smasher 3D art files found in 3d-art.zip."
            exit 1
          fi

          # Discontinued Project 3D models ship with their final names in the same zip
          mkdir -p "assets/images/3d-art/discontinued-project"
          find /tmp/3d-art-extracted -name "DP_Model_*.png" -exec cp {} "assets/images/3d-art/discontinued-project/" \;
          echo "=== Downloaded Discontinued Project 3D art files ==="
          ls -la "assets/images/3d-art/discontinued-project/"
          if [ "$(ls -A assets/images/3d-art/discontinued-project/)" == "" ]; then
            echo "ERROR: No Discontinued Project 3D art files found in 3d-art.zip."
            exit 1
          fi

          # Unnamed Project 3D models ship with their final names in the same zip
          mkdir -p "assets/images/3d-art/unnamed-project"
          find /tmp/3d-art-extracted -name "UP_Model_*.png" -exec cp {} "assets/images/3d-art/unnamed-project/" \;
          echo "=== Downloaded Unnamed Project 3D art files ==="
          ls -la "assets/images/3d-art/unnamed-project/"
          if [ "$(ls -A assets/images/3d-art/unnamed-project/)" == "" ]; then
            echo "ERROR: No Unnamed Project 3D art files found in 3d-art.zip."
            exit 1
          fi

      - name: Remove protected assets gitignore entries for deployment
        if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main'
        run: |
          sed -i '/assets\/images\/concept-art\//d' .gitignore
          sed -i '/assets\/images\/ui-ux\//d' .gitignore
          sed -i '/assets\/images\/3d-art\//d' .gitignore

      - name: Deploy to GitHub Pages
        if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main'
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages
          publish_dir: .