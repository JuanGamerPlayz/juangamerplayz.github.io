name: Deploy

on:
  push:
    branches: [main, master]
  workflow_dispatch:
    inputs:
      download_art:
        description: "Download protected art assets from private source"
        required: false
        default: "true"
        type: boolean

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Download protected art assets
        if: github.event_name == 'push' || github.event.inputs.download_art == 'true'
        env:
          GH_TOKEN: ${{ secrets.ART_ASSETS_TOKEN }}
        run: |
          mkdir -p assets/images/concept-art/crypt-hunter
          gh release download v1 \
            --repo JuanGamerPlayz/concept-art-assets \
            -p "*.zip" \
            -O /tmp/concept-art.zip
          unzip -o /tmp/concept-art.zip -d assets/images/concept-art/crypt-hunter/
          ls -la assets/images/concept-art/crypt-hunter/

      - name: Download protected UI/UX assets - Listōu
        if: github.event_name == 'push' || github.event.inputs.download_art == 'true'
        env:
          GH_TOKEN: ${{ secrets.ART_ASSETS_TOKEN }}
        run: |
          mkdir -p assets/images/ui-ux/listou
          cd assets/images/ui-ux/listou
          gh release download listou-v1 \
            --repo JuanGamerPlayz/concept-art-assets \
            -p "LT_*.png"
          ls -la

      - name: Download protected UI/UX assets - The Last Oucome
        if: github.event_name == 'push' || github.event.inputs.download_art == 'true'
        env:
          GH_TOKEN: ${{ secrets.ART_ASSETS_TOKEN }}
        run: |
          mkdir -p assets/images/ui-ux/the-last-outcome
          cd assets/images/ui-ux/the-last-outcome
          gh release download tlo-v1 \
            --repo JuanGamerPlayz/concept-art-assets \
            -p "TLO_*.png"
          ls -la

      - name: Download protected UI/UX assets - Chop & Clock!
        if: github.event_name == 'push' || github.event.inputs.download_art == 'true'
        env:
          GH_TOKEN: ${{ secrets.ART_ASSETS_TOKEN }}
        run: |
          mkdir -p "assets/images/ui-ux/chop-and-clock"
          cd "assets/images/ui-ux/chop-and-clock"
          gh release download chopclock-v1 \
            --repo JuanGamerPlayz/concept-art-assets \
            -p "CC_*.png"
          ls -la

      - name: Download protected 3D Art assets - The Last Outcome - Models
        if: github.event_name == 'push' || github.event.inputs.download_art == 'true'
        env:
          GH_TOKEN: ${{ secrets.ART_ASSETS_TOKEN }}
        run: |
          mkdir -p "assets/images/3d-art/the-last-outcome"
          cd "assets/images/3d-art/the-last-outcome"
          gh release download tlo-models-v1 \
            --repo JuanGamerPlayz/concept-art-assets \
            -p "TLO_MODEL_*.png"
          echo "=== Downloaded 3D art files ==="
          ls -la
          if [ "$(ls -A)" == "" ]; then
            echo "ERROR: No 3D art files downloaded! Check that release 'tlo-models-v1' exists with TLO_MODEL_*.png files."
            exit 1
          fi

      - name: Remove protected assets gitignore entries for deployment
        if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main'
        run: |
          sed -i '/assets\/images\/concept-art\//d' .gitignore
          sed -i '/assets\/images\/ui-ux\//d' .gitignore
          sed -i '/assets\/images\/3d-art\//d' .gitignore

      - name: Deploy to GitHub Pages
        if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main'
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages
          publish_dir: .